<html lang="sk">
<head>

<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --border:#e5e7eb; --line:#f0f1f3; --text:#111827; --muted:#6b7280; --faint:#9ca3af;
    --accent:#1d4ed8; --accent-soft:#eef2ff; --danger:#b91c1c; --danger-soft:#fef2f2; --ok:#047857; --ok-soft:#ecfdf5;
    --warn:#92400e; --warn-soft:#fffbeb;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg);
    color:var(--text); padding-bottom:84px; font-size:15px; line-height:1.4;}
  header{background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;}
  header h1{font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em;}
  header .right{display:flex; gap:6px;}
  .link{background:none; color:var(--accent); padding:6px 8px; font-size:14px; font-weight:600;}
  main{padding:14px 12px; max-width:720px; margin:0 auto;}
  .title{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:4px 4px 12px;}
  .title h2{font-size:22px; margin:0; letter-spacing:-.02em;}
  .title .muted{text-align:right;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .card h3{font-size:12px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .muted{color:var(--muted); font-size:13px;}
  .num{font-variant-numeric:tabular-nums;}
  .empty{color:var(--muted); text-align:center; padding:18px 0;}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--border); border-radius:10px;
    background:#fff; color:var(--text); font-family:inherit;}
  input[type=date]{-webkit-appearance:none; appearance:none; min-height:44px; display:block; text-align:left;}
  input[type=date]::-webkit-date-and-time-value{text-align:left;}
  input:focus, select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  button{font-size:15px; padding:12px 16px; border-radius:10px; border:none; cursor:pointer; background:var(--accent);
    color:#fff; font-weight:600; font-family:inherit;}
  button.block{width:100%; margin-top:14px;}
  button.secondary{background:#e5e7eb; color:var(--text);}
  button.small{padding:6px 10px; font-size:13px;}
  button.del{background:none; color:var(--danger); padding:4px 0 4px 10px; font-size:13px; font-weight:500;}
  button:disabled{opacity:.5; cursor:default;}
  .row{display:flex; gap:8px;} .row > *{flex:1; min-width:0;}

  /* zoznam nápojov s počtom */
  .qty .grp{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:16px 0 2px;}
  .qty .grp:first-child{margin-top:4px;}
  .qty .it{display:flex; align-items:center; gap:12px; padding:6px 0; border-bottom:1px solid var(--line);}
  .qty .it:last-child{border-bottom:none;}
  .qty .it span{flex:1; min-width:0;}
  .qty .it input{width:96px; text-align:right; padding:9px 10px;}
  .total{display:flex; justify-content:space-between; font-weight:600; padding-top:10px;}

  /* stav */
  .stock{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .stock:last-child{border-bottom:none;}
  .stock .n{font-size:22px; font-weight:700; letter-spacing:-.02em;}
  .stock .n.neg{color:var(--danger);}
  .detail{padding:2px 0 10px;}

  /* rozpis */
  .ln{display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:14px;}
  .ln .v{font-variant-numeric:tabular-nums; white-space:nowrap;}
  .ln.in1{padding-left:14px;} .ln.in2{padding-left:28px; color:var(--muted);}
  .ln.sum{border-top:1px solid var(--border); margin-top:4px; padding-top:7px; font-weight:600;}
  .ln.key{font-weight:700;} .ln.bad{color:var(--danger); font-weight:700;}
  .drink{border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}
  .drink:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .drink .name{font-weight:700; font-size:16px; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px;}

  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .kpi{background:var(--bg); border-radius:10px; padding:10px 12px;}
  .kpi .l{font-size:12px; color:var(--muted);} .kpi .v{font-size:22px; font-weight:700; letter-spacing:-.02em;}
  .kpi.hl{background:var(--accent-soft);} .kpi.hl .v{color:var(--accent);}
  .kpi.bad{background:var(--danger-soft);} .kpi.bad .v{color:var(--danger);}

  .chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px;}
  .chips button{background:#fff; color:var(--text); border:1px solid var(--border); padding:7px 12px; font-size:13px; font-weight:500; white-space:nowrap; border-radius:999px;}
  .chips button.on{background:var(--text); color:#fff; border-color:var(--text);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  td{padding:7px 0; border-bottom:1px solid var(--line);} td:last-child{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:10px;}
  tr:last-child td{border-bottom:none;}

  .entry{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry .l{min-width:0; overflow-wrap:anywhere;} .entry .r{text-align:right; white-space:nowrap;}
  .note{background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .note.bad{background:var(--danger-soft); color:var(--danger);}

  .screen{display:none;} .screen.active{display:block;}
  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom,0px);}
  nav.tabs button{flex:1; background:none; color:var(--faint); border-radius:0; padding:8px 2px 9px; font-size:11px;
    font-weight:500; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button.active{color:var(--accent); font-weight:700;}
  nav.tabs svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

  .center{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:14px;}
  .center p{color:var(--muted); max-width:340px;}
  .spinner{width:34px; height:34px; border-radius:50%; border:4px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 18px;
    border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:30; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  /* mesiac */
  .seg{display:flex; background:#e5e7eb; border-radius:10px; padding:3px; gap:3px; margin-bottom:12px;}
  .seg button{flex:1; background:none; color:var(--muted); padding:8px 4px; font-size:13px; font-weight:600; border-radius:8px;}
  .seg button.on{background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .big{font-size:26px; font-weight:800; letter-spacing:-.03em; margin:2px 0;}
  .big.bad{color:var(--danger);} .big.ok{color:var(--ok);} .big.warn{color:var(--warn);}
  .flow{font-size:13px; color:var(--muted); margin-top:4px;}
  table.t{font-size:14px;} table.t th{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    text-align:right; padding:0 0 6px 6px; border-bottom:1px solid var(--border);} table.t th:first-child{text-align:left; padding-left:0;}
  table.t td{text-align:right; padding:9px 0 9px 6px; font-variant-numeric:tabular-nums; white-space:nowrap;} table.t td:first-child{text-align:left; padding-left:0; white-space:normal;}
  table.t tr.click{cursor:pointer;} table.t tr.sumr td{font-weight:700; border-top:1px solid var(--border); border-bottom:none;}
  table.t td.bad{color:var(--danger); font-weight:700;} table.t td.warn{color:var(--warn); font-weight:700;} table.t td.ok{color:var(--ok);}
  table.t tr.det td{background:var(--bg); padding:8px 10px; white-space:normal; text-align:left;}
  .caret{color:var(--faint); font-size:11px; margin-left:4px;}
  .demo{background:var(--warn-soft); color:var(--warn); text-align:center; font-size:12px; padding:4px;}
</style>
</head>
<body>

<header>
  <h1>Sklad nápojov</h1>

<main>

  <section id="screen-prijem" class="screen"></section>
  <section id="screen-vydaj" class="screen"></section>

</main>
<nav class="tabs">
  <button data-s="stav" onclick="go('stav')"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg>Stav</button>
  <button data-s="prijem" onclick="go('prijem')"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Príjem</button>
  <button data-s="vydaj" onclick="go('vydaj')"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11"/><path d="M12 9c-2-4-6-4-6-1.5S10 9 12 9c2 0 6 1 6-1.5S14 5 12 9z"/></svg>Výdaj</button>
  <button data-s="inventura" onclick="go('inventura')"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 15h4"/></svg>Inventúra</button>
  <button data-s="mesiac" onclick="go('mesiac')"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Mesiac</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* Sklad nápojov v5: komisionálny sklad s priebežnou evidenciou.
   Tovar patrí PPP, kým ho nepredá PPP (Shoptet) alebo GSO (Shopify, predaj mimo Shopify) alebo kým sa nerozdá či neodpíše.
   Každý výdaj má doklad. Dátum pohybu = deň odoslania.
   Stav nápoja = počiatočný stav (prvá inventúra, v ktorej je nápoj) + príjmy − výdaje + inventúrne rozdiely.
   Inventúra je kontrola: počíta sa na začiatku dňa D, rozdiel = napočítané − evidovaný stav pred dňom D
   a zapíše sa ako pohyb s dátumom D − 1 (patrí ešte do predchádzajúceho dňa). Inventúra môže byť aj čiastočná.
   Rozdiely sa prepočítavajú pri každej zmene údajov, takže dodatočne zadaný príjem rozdiel opraví.
   Mesačný prehľad je za kalendárny mesiac; faktúra GSO = Shopify + predaj mimo Shopify + propagácia.
   Automaticky (nočná synchronizácia, Sklad-app/predaje.json): Shoptet (PPP) a Shopify (GSO). */

const APP_VERSION = "v5.0";
const DEMO = new URLSearchParams(location.search).has("demo");
const MSAL_CONFIG = { auth:{ clientId:"22026742-db1b-4ee6-877a-5b279b1e5775",
  authority:"https://login.microsoftonline.com/35f15dc8-00c9-43d4-99e4-ab82e15ec3bb",
  redirectUri: location.origin + location.pathname }, cache:{ cacheLocation:"localStorage" } };
const GRAPH_SCOPES = ["Sites.ReadWrite.All"];
const SITE_HOST = "translata.sharepoint.com", SITE_PATH = "/sites/liquidpositive";
const FILE = "Sklad-app/sklad.json", FILE_SALES = "Sklad-app/predaje.json", FILE_V1 = "Sklad-app/sklad-data.json";
const LP_NAMES = ["Orange","Marakuja","Granat","Granát","Pure","Cannabis","Cherry","Outlast"];
const G_LP = "Liquid Positive", G_OTHER = "Krab a pivá";
const OUT = {
  propagacia:{ label:"Propagácia", field:"Akcia", ph:"napr. Bratislava Marathon", gso:true },
  mimo:      { label:"Predaj mimo Shopify", field:"Odberateľ", ph:"napr. firma, číslo faktúry", gso:true },
  odpis:     { label:"Odpis", field:"Dôvod", ph:"napr. rozbité pri vykládke", gso:false }
};

let S = { data:null, etag:null, sales:null, user:"", screen:"stav", period:null, open:{}, outType:"propagacia", mGroup:null, mTab:"sklad", mOpen:null, month:null, invOpen:null };

/* ---------- pomocné ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("sk-SK");
const fmtN = n => nf.format(n);
const fmtS = n => n < 0 ? "−" + fmtN(-n) : fmtN(n);
const fmtD = iso => { const [y,m,d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };
const fmtDs = iso => { const [,m,d] = iso.split("-"); return `${+d}. ${+m}.`; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, "");
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
const emptyData = () => ({ version:4, drinks:[], receipts:[], counts:[], outs:[], beforeCount:{} });
function normalize(d){ ["drinks","receipts","counts","outs"].forEach(k => d[k] = d[k] || []); d.beforeCount = d.beforeCount || {};
  // rozdané z v3 sú propagácia na účet GSO
  (d.giveaways || []).forEach(g => d.outs.push({ id:g.id, type:"propagacia", date:g.date, label:g.event, items:g.items, by:g.by, at:g.at }));
  delete d.giveaways;
  d.drinks.forEach(x => { if (!x.key) x.key = x.name; delete x.gso; }); return d; }

const drinks = (all) => S.data.drinks.filter(d => all || !d.hidden);
const drinkById = id => S.data.drinks.find(d => d.id === id);
const counts = () => [...S.data.counts].sort((a,b) => a.date.localeCompare(b.date));
const groups = list => { const g = {}; list.forEach(d => (g[d.group || G_OTHER] = g[d.group || G_OTHER] || []).push(d));
  return Object.entries(g).sort((a,b) => (a[0] === G_LP ? -1 : b[0] === G_LP ? 1 : a[0].localeCompare(b[0]))); };

/* ---------- predaje zo synchronizácie, priradené k nápojom ---------- */
function salesFor(){
  const byKey = {}; S.data.drinks.forEach(d => { byKey[norm(d.key)] = d.id; });
  const sh = [], sf = []; const s = S.sales || {};
  // objednávka odoslaná v deň inventúry ešte pred počítaním patrí do predchádzajúceho obdobia
  (s.shoptet || []).forEach(l => { const id = byKey[norm(l.k)];
    if (id) sh.push({ ...l, d:S.data.beforeCount[l.o] ? addDays(l.d, -1) : l.d, drinkId:id }); });
  (s.shopify || []).forEach(l => { const id = byKey[norm(l.k)]; if (id) sf.push({ ...l, drinkId:id }); });
  return { sh, sf };
}

/* ---------- kniha pohybov po nápojoch ---------- */
const MONTHS = ["január","február","marec","apríl","máj","jún","júl","august","september","október","november","december"];
const monthName = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const nextMonth = ym => { let [y, m] = ym.split("-").map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${String(m).padStart(2, "0")}`; };
function buildLedger(){
  const sales = salesFor(), C = counts(), L = {};
  S.data.drinks.forEach(d => {
    const mv = [];
    S.data.receipts.forEach(r => { if (r.drinkId === d.id) mv.push({ date:r.date, k:"prod", q:r.qty }); });
    S.data.outs.forEach(o => { if (o.items[d.id]) mv.push({ date:o.date, k:o.type, q:-o.items[d.id] }); });
    sales.sh.forEach(x => { if (x.drinkId === d.id && !x.gso) mv.push({ date:x.d, k:"ppp", q:-x.q }); });
    sales.sf.forEach(x => { if (x.drinkId === d.id) mv.push({ date:x.d, k:x.t === "B2C" ? "b2c" : "b2b", q:-x.q }); });
    const first = C.find(c => c.counts[d.id] != null);
    if (!first) { L[d.id] = { start:null, mv:[], adj:[] }; return; }
    const start = { date:first.date, qty:first.counts[d.id], countId:first.id };
    const m = mv.filter(x => x.date >= start.date), adj = [];
    C.filter(c => c.date > start.date && c.counts[d.id] != null).forEach(c => {
      const book = start.qty + m.reduce((s, x) => s + (x.date < c.date ? x.q : 0), 0) + adj.reduce((s, a) => s + a.diff, 0);
      adj.push({ date:addDays(c.date, -1), countDate:c.date, countId:c.id, counted:c.counts[d.id], book, diff:c.counts[d.id] - book, note:(c.notes || {})[d.id] || "" });
    });
    L[d.id] = { start, mv:m, adj };
  });
  return L;
}
/* evidovaný stav na začiatku dňa X (pohyby s dátumom < X) */
function bookAt(l, X){
  if (!l.start || X < l.start.date) return null;
  return l.start.qty + l.mv.reduce((s, x) => s + (x.date < X ? x.q : 0), 0) + l.adj.reduce((s, a) => s + (a.date < X ? a.diff : 0), 0);
}
/* pohyby nápoja v období [from, to) */
function calc(l, from, to){
  const r = { missing:!l.start || to <= l.start.date };
  if (r.missing) return r;
  r.from = from < l.start.date ? l.start.date : from; r.started = r.from !== from;
  const inP = x => x >= r.from && x < to, sum = k => -l.mv.reduce((s, x) => s + (x.k === k && inP(x.date) ? x.q : 0), 0);
  r.open = bookAt(l, r.from); r.prod = -sum("prod");
  r.ppp = sum("ppp"); r.b2c = sum("b2c"); r.b2b = sum("b2b"); r.shopify = r.b2c + r.b2b;
  Object.keys(OUT).forEach(t => { r[t] = sum(t); });
  r.gsoInv = r.shopify + r.mimo + r.propagacia;
  r.out = r.ppp + r.gsoInv + r.odpis;
  r.adjs = l.adj.filter(a => inP(a.date)); r.adj = r.adjs.reduce((s, a) => s + a.diff, 0);
  r.close = bookAt(l, to);
  return r;
}
const diffCls = n => n < 0 ? "bad" : n > 0 ? "warn" : "ok";
const diffWord = n => n < 0 ? "Manko" : n > 0 ? "Prebytok" : "Sedí";

/* riadky rozpisu výdajov pre jeden nápoj */
function outLines(r){
  return [["− PPP (Shoptet)", r.ppp], ["− GSO Shopify balíčky", r.b2c], ["− GSO Shopify plechovky", r.b2b],
    ["− GSO predaj mimo Shopify", r.mimo], ["− Propagácia (GSO)", r.propagacia], ["− Odpisy", r.odpis]]
    .filter(([, n]) => n).map(([l, n]) => ln(l, fmtN(n))).join("")
    + (r.adjs || []).filter(a => a.diff).map(a => ln(`${a.diff < 0 ? "−" : "+"} Inventúra ${fmtDs(a.countDate)}${a.note ? ` (${esc(a.note)})` : ""}`, fmtN(Math.abs(a.diff)), a.diff < 0 ? "bad" : "")).join("");
}

/* ---------- úložisko ---------- */
let msalInstance = null, account = null, SITE_ID = null;
async function initMsal(){
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  const res = await msalInstance.handleRedirectPromise();
  if (res && res.account) { account = res.account; return; }
  const a = msalInstance.getAllAccounts(); if (a.length) { account = a[0]; return; }
  try { account = (await msalInstance.ssoSilent({ scopes:GRAPH_SCOPES })).account; } catch(e){}
}
function prihlasit(){ $("auth-error").textContent = ""; msalInstance.loginRedirect({ scopes:GRAPH_SCOPES }); }
function odhlasit(){ msalInstance.logoutRedirect(); }
async function token(){
  try { return (await msalInstance.acquireTokenSilent({ scopes:GRAPH_SCOPES, account })).accessToken; }
  catch(e){ await msalInstance.acquireTokenRedirect({ scopes:GRAPH_SCOPES }); return null; }
}
async function gfetch(url, opt = {}){
  const t = await token();
  return fetch(url, { ...opt, headers:{ Authorization:`Bearer ${t}`, ...(opt.headers || {}) } });
}
async function siteId(){
  if (SITE_ID) return SITE_ID;
  const r = await gfetch(`https://graph.microsoft.com/v1.0/sites/${SITE_HOST}:${SITE_PATH}`);
  if (!r.ok) throw new Error(`Site (${r.status})`);
  SITE_ID = (await r.json()).id; return SITE_ID;
}
const itemUrl = p => `https://graph.microsoft.com/v1.0/sites/${SITE_ID}/drive/root:/${p}`;

const GraphStore = {
  async load(file){
    await siteId();
    const meta = await gfetch(itemUrl(file));
    if (meta.status === 404) return { data:null, etag:null };
    if (!meta.ok) throw new Error(`Načítanie ${file} (${meta.status})`);
    const etag = (await meta.json()).eTag;
    const c = await gfetch(itemUrl(file) + ":/content");
    if (!c.ok) throw new Error(`Obsah ${file} (${c.status})`);
    return { data:await c.json(), etag };
  },
  async save(file, data, etag){
    const headers = { "Content-Type":"application/json" };
    if (etag) headers["If-Match"] = etag;
    const r = await gfetch(itemUrl(file) + ":/content", { method:"PUT", headers, body:JSON.stringify(data) });
    if (r.status === 412) throw new Error("CONFLICT");
    if (!r.ok) throw new Error(`Zápis (${r.status})`);
    return (await r.json()).eTag;
  }
};
const DemoStore = {
  async load(file){ let r = null; try { r = localStorage.getItem("sklad_v3_demo:" + file); } catch(e){}
    r = r ?? (window.__mem || {})[file]; return { data:r ? JSON.parse(r) : null, etag:null }; },
  async save(file, data){ try { localStorage.setItem("sklad_v3_demo:" + file, JSON.stringify(data)); }
    catch(e){ (window.__mem = window.__mem || {})[file] = JSON.stringify(data); } return null; }
};
const Store = DEMO ? DemoStore : GraphStore;

async function loadAll(){
  const [m, s] = await Promise.all([Store.load(FILE), Store.load(FILE_SALES)]);
  S.data = normalize(m.data || (DEMO ? seedDemo() : emptyData())); S.etag = m.etag; S.fresh = !m.data && !DEMO;
  S.sales = s.data;
}
async function mutate(fn, okMsg){
  const snap = JSON.stringify(S.data);
  try { fn(); S.etag = await Store.save(FILE, S.data, S.etag); S.fresh = false; if (okMsg) toast(okMsg); renderAll(); return true; }
  catch(e){
    S.data = JSON.parse(snap);
    if (e.message === "CONFLICT") { toast("Dáta medzitým zmenil niekto iný. Načítavam znova, zopakuj zápis."); await loadAll(); renderAll(); }
    else { toast("Chyba: " + e.message); renderAll(); }
    return false;
  }
}

function qtyList(prefix, values = {}){
  let h = `<div class="qty">`;
  groups(drinks()).forEach(([g, list]) => {
    h += `<div class="grp">${esc(g)}</div>`;
    list.forEach(d => { h += `<div class="it"><span>${esc(d.name)}</span>
      <input type="number" inputmode="numeric" min="0" id="${prefix}-${d.id}" value="${values[d.id] ?? ""}" placeholder="0" oninput="qtyTotal('${prefix}')"></div>`; });
  });
  return h + `</div><div class="total"><span>Spolu</span><span class="num" id="${prefix}-total">0</span></div>`;
}
function qtyRead(prefix, required, keepZero){
  const out = {}; let bad = false;
  drinks().forEach(d => { const v = $(`${prefix}-${d.id}`).value.trim();
    if (v === "") { if (required) bad = true; return; }
    const n = Math.round(Number(v)); if (!Number.isFinite(n) || n < 0) { bad = true; return; }
    if (n > 0 || required || keepZero) out[d.id] = n; });
  return bad ? null : out;
}
function qtyTotal(prefix){ let t = 0; drinks().forEach(d => { t += Number($(`${prefix}-${d.id}`).value) || 0; }); $(`${prefix}-total`).textContent = fmtN(t); }

/* priame objednávky zo Shoptetu s dátumom inventúry: treba určiť, či odišli pred počítaním */

    const d = S.data.drinks.find(x => norm(x.key) === norm(l.k)); if (!d || d.hidden) return;
    const x = o[l.o] = o[l.o] || { o:l.o, d:l.d, c:l.c, items:[], n:0 }; x.items.push(`${d.name} ${fmtN(l.q)}`); x.n += l.q; });

/* ---------- MESIAC (kalendárny) ---------- */
function renderMesiac(){
  const el = $("screen-mesiac");
  if (!S.data.drinks.length) { el.innerHTML = onboarding(); return; }
  const I = counts();
  if (!I.length) { el.innerHTML = `<div class="title"><h2>Mesiac</h2></div><div class="card empty">Prehľad sa ukáže po počiatočnej inventúre.</div>`; return; }
  const cur = todayISO().slice(0, 7), M = [];
  for (let m = I[0].date.slice(0, 7); m <= cur; m = nextMonth(m)) M.push(m);
  if (!S.month || !M.includes(S.month)) S.month = M.length > 1 ? M[M.length - 2] : cur;
  const from = S.month + "-01", to = nextMonth(S.month) + "-01", running = S.month === cur, end = running ? addDays(todayISO(), 1) : to;
  const L = buildLedger(), sales = salesFor(), inP = x => x >= from && x < end;
  const G = groups(drinks()); if (!G.some(([g]) => g === S.mGroup)) S.mGroup = G[0][0];
  const list = G.find(([g]) => g === S.mGroup)[1];
  const rows = list.map(d => ({ d, r:calc(L[d.id], from, end) })), ok = rows.filter(x => !x.r.missing);
  const T = k => ok.reduce((s, x) => s + (x.r[k] || 0), 0);
  const hasGso = T("gsoInv") > 0;
  if (S.mTab === "gso" && !hasGso) S.mTab = "sklad";
  const lastDay = fmtDs(addDays(end, -1)), counted = ok.some(x => x.r.adjs.length), adj = T("adj");

  let h = `<div class="title"><h2>Mesiac</h2></div>
    <div class="chips">${M.map(m => `<button class="${m === S.month ? "on" : ""}" onclick="S.month='${m}';S.mOpen=null;renderMesiac()">${monthName(m)}${m === cur ? " (priebežne)" : ""}</button>`).reverse().join("")}</div>`;
  if (G.length > 1) h += `<div class="seg">${G.map(([g]) => `<button class="${g === S.mGroup ? "on" : ""}" onclick="S.mGroup='${esc(g)}';S.mOpen=null;renderMesiac()">${esc(g)}</button>`).join("")}</div>`;

  const startLbl = ok.length && ok.every(x => x.r.started) ? `Počiatočný stav ${fmtDs(ok[0].r.from)}` : `Stav ${fmtDs(from)}`;
  h += `<div class="card"><div class="muted">${startLbl} ${fmtN(T("open"))} → ${running ? "dnes" : lastDay} <b style="color:var(--text)">${fmtN(T("close"))}</b></div>
    <div class="big num ${counted ? diffCls(adj) : ""}" style="${counted ? "" : "color:var(--muted)"}">${counted ? (adj ? `${diffWord(adj)} ${fmtN(Math.abs(adj))} ks` : "Inventúra sedí") : "Bez inventúry"}</div>
    <div class="flow">Príjem ${fmtN(T("prod"))} · PPP ${fmtN(T("ppp"))}${hasGso ? ` · GSO ${fmtN(T("gsoInv"))}` : ""}${T("odpis") ? ` · odpisy ${fmtN(T("odpis"))}` : ""}</div></div>`;
  const open = ((S.sales || {}).shopifyOpen || []).filter(o => inP(o.d));
  if (open.length && hasGso) h += `<div class="note">${open.length} ${open.length === 1 ? "objednávka" : "objednávky"} v Shopify bez označenia odoslané (${fmtN(open.reduce((s, o) => s + o.q, 0))} ks): ${open.map(o => esc(o.o)).join(", ")}. Počítajú sa ku dňu objednávky.</div>`;

  h += `<div class="seg"><button class="${S.mTab === "sklad" ? "on" : ""}" onclick="S.mTab='sklad';renderMesiac()">Sklad</button>
    ${hasGso ? `<button class="${S.mTab === "gso" ? "on" : ""}" onclick="S.mTab='gso';renderMesiac()">Faktúra GSO</button>` : ""}
    <button class="${S.mTab === "ppp" ? "on" : ""}" onclick="S.mTab='ppp';renderMesiac()">Odberatelia PPP</button></div>`;

  if (S.mTab === "sklad") {
    h += `<div class="card"><table class="t"><tr><th>Nápoj</th><th>${fmtDs(from)}</th><th>${running ? "Dnes" : lastDay}</th><th>Inventúra</th></tr>`;
    rows.forEach(({ d, r }) => {
      if (r.missing) { h += `<tr><td>${esc(d.name)}</td><td colspan="3" class="muted">bez počiatočnej inventúry</td></tr>`; return; }
      const isOpen = S.mOpen === d.id;
      h += `<tr class="click" onclick="S.mOpen=${isOpen ? "null" : `'${d.id}'`};renderMesiac()"><td>${esc(d.name)}<span class="caret">${isOpen ? "▲" : "▼"}</span></td>
        <td>${fmtN(r.open)}</td><td>${fmtS(r.close)}</td><td class="${r.adjs.length ? diffCls(r.adj) : ""}">${r.adjs.length ? (r.adj ? fmtS(r.adj) : "0") : "–"}</td></tr>`;
      if (isOpen) h += `<tr class="det"><td colspan="4">${ln(`${r.started ? "Počiatočný stav" : "Stav"} ${fmtDs(r.from)}`, fmtN(r.open))}${r.prod ? ln("+ Príjem", fmtN(r.prod)) : ""}${outLines(r)}
        ${ln(`= Stav ${running ? "dnes" : lastDay}`, fmtS(r.close), "sum")}</td></tr>`;
    });
    h += `<tr class="sumr"><td>Spolu</td><td>${fmtN(T("open"))}</td><td>${fmtS(T("close"))}</td><td class="${counted ? diffCls(adj) : ""}">${counted ? (adj ? fmtS(adj) : "0") : "–"}</td></tr></table>
      <p class="muted" style="margin:10px 0 0">Ťuknutím na nápoj zobrazíš pohyby. Rozdiely vysvetľuješ na obrazovke Inventúra.</p></div>`;
  } else if (S.mTab === "gso") {
    const gr = ok.filter(x => x.r.gsoInv);
    h += `<div class="card"><table class="t"><tr><th>Nápoj</th><th>Shopify</th><th>Mimo</th><th>Prop.</th><th>Spolu</th></tr>
      ${gr.map(({ d, r }) => `<tr><td>${esc(d.name)}</td><td>${fmtN(r.shopify)}</td><td>${fmtN(r.mimo)}</td><td>${fmtN(r.propagacia)}</td><td><b>${fmtN(r.gsoInv)}</b></td></tr>`).join("")}
      <tr class="sumr"><td>Spolu</td><td>${fmtN(T("shopify"))}</td><td>${fmtN(T("mimo"))}</td><td>${fmtN(T("propagacia"))}</td><td>${fmtN(T("gsoInv"))}</td></tr></table>
      ${running ? `<p class="muted" style="margin:10px 0 0">Mesiac ešte prebieha, čísla sa budú meniť.</p>` : ""}
      <button class="secondary block" onclick="copyGso()">Kopírovať do schránky</button></div>`;
  } else {
    const cust = {};
    sales.sh.filter(l => !l.gso && inP(l.d) && list.some(d => d.id === l.drinkId)).forEach(l => { cust[l.c] = (cust[l.c] || 0) + l.q; });
    const ce = Object.entries(cust).sort((a, b) => b[1] - a[1]);
    h += `<div class="card">` + (ce.length ? `<table class="t"><tr><th>Odberateľ</th><th>Plechovky</th></tr>${ce.map(([c, n]) => `<tr><td>${esc(c)}</td><td>${fmtN(n)}</td></tr>`).join("")}
      <tr class="sumr"><td>Spolu</td><td>${fmtN(T("ppp"))}</td></tr></table>` : `<div class="empty">V tomto mesiaci žiadne.</div>`) + `</div>`;
  }
  el.innerHTML = h + syncInfo();
}
function copyGso(){
  const from = S.month + "-01", to = nextMonth(S.month) + "-01", L = buildLedger();
  const lines = drinks().map(d => ({ d, r:calc(L[d.id], from, to) })).filter(x => !x.r.missing && x.r.gsoInv).map(x => `${x.d.name}\t${x.r.gsoInv}`);
  navigator.clipboard.writeText(`Faktúra GSO ${monthName(S.month)}\n` + lines.join("\n")).then(() => toast("Skopírované"), () => toast("Kopírovanie sa nepodarilo"));
}
async function setNote(countId, drinkId, v){
  await mutate(() => { const c = S.data.counts.find(x => x.id === countId); c.notes = c.notes || {};
    if (v.trim()) c.notes[drinkId] = v.trim(); else delete c.notes[drinkId]; }, "Uložené");
}

/* ---------- NASTAVENIA ---------- */
function renderNastavenia(){
  const el = $("screen-nastavenia");
  let h = `<div class="title"><h2>Nastavenia</h2><button class="link" onclick="go('stav')">Späť</button></div>`;
  h += `<div class="card"><h3>Nápoje</h3><p class="muted" style="margin-top:0">„Názov v exporte“ musí sedieť s názvom v synchronizácii (sync/mapping.json).</p>`;
  drinks(true).forEach(d => {
    h += `<div class="entry" style="display:block"><div class="row"><div><label>Názov</label><input type="text" value="${esc(d.name)}" onchange="setDrink('${d.id}','name',this.value)"></div>
      <div><label>Názov v exporte</label><input type="text" value="${esc(d.key)}" onchange="setDrink('${d.id}','key',this.value)"></div></div>
      <div class="row" style="align-items:flex-end"><div><label>Skupina</label><input type="text" value="${esc(d.group || "")}" onchange="setDrink('${d.id}','group',this.value)"></div>
      <div style="display:flex; gap:12px; padding-bottom:10px; font-size:14px;"><label style="margin:0;color:var(--text)"><input type="checkbox" ${d.hidden ? "checked" : ""} onchange="setDrink('${d.id}','hidden',this.checked)"> Skryť</label></div></div></div>`;
  });
  h += `<div class="row" style="margin-top:12px"><input type="text" id="nd-name" placeholder="Nový nápoj"><button class="secondary" style="flex:0 0 auto" onclick="addDrink()">Pridať</button></div></div>`;
  const u = S.sales?.unmapped || {}, un = [...Object.entries(u.shoptet || {}), ...Object.entries(u.shopify || {})].sort((a, b) => b[1] - a[1]);
  h += `<div class="card"><h3>Synchronizácia predajov</h3>${S.sales ? `<p style="margin-top:0">Posledná: ${new Date(S.sales.updatedAt).toLocaleString("sk-SK")}, údaje od ${fmtD(S.sales.since)}.</p>` : `<p style="margin-top:0">Súbor predaje.json zatiaľ nie je v SharePointe.</p>`}
    ${un.length ? `<details><summary class="muted">Nesledované položky z exportov (${un.length})</summary><table>${un.map(([k, n]) => `<tr><td>${esc(k)}</td><td>${fmtN(Math.round(n))}</td></tr>`).join("")}</table></details>` : ""}</div>`;
  h += `<div class="card"><h3>Pôvodná appka</h3><p class="muted" style="margin-top:0">Prepíše nápoje, príjmy a inventúry dátami z pôvodnej appky. Výdaje ostanú.</p>
    <button class="secondary" onclick="migrateV1()">Načítať znova z pôvodnej appky</button></div>`;
  h += `<div class="card"><h3>O appke</h3><p class="muted" style="margin:0">${APP_VERSION} · ${DEMO ? "ukážkový režim" : esc(S.user)}</p>
    ${DEMO ? "" : `<button class="secondary" style="margin-top:10px" onclick="odhlasit()">Odhlásiť sa</button>`}</div>`;
  el.innerHTML = h;
}
async function setDrink(id, k, v){
  if (typeof v === "string") { v = v.trim(); if (!v && k !== "group") return toast("Nesmie byť prázdne"); }
  await mutate(() => { drinkById(id)[k] = v; }, "Uložené");
}
async function addDrink(){
  const name = $("nd-name").value.trim(); if (!name) return toast("Zadaj názov");
  await mutate(() => S.data.drinks.push({ id:uid(), name, key:name, group:G_OTHER }), "Nápoj pridaný");
}
async function migrateV1(){
  if (!S.fresh && !confirm("Prepísať nápoje, príjmy a inventúry dátami z pôvodnej appky?")) return;
  let v1;
  try { if (DEMO) throw new Error("V ukážkovom režime nie je pôvodná appka."); v1 = (await Store.load(FILE_V1)).data; if (!v1) throw new Error("Súbor pôvodnej appky sa nenašiel."); }
  catch(e){ return toast("Chyba: " + e.message); }
  // príjmy s dátumom inventúry boli v pôvodnej appke už napočítané, preto patria do predchádzajúceho dňa
  const invDates = new Set((v1.inventories || []).map(i => i.date));
  const old = Object.fromEntries(S.data.drinks.map(d => [d.id, d]));
  await mutate(() => {
    S.data.drinks = (v1.drinks || []).map(d => old[d.id] ? { ...old[d.id], name:d.name }
      : { id:d.id, name:d.name, key:d.name, group:LP_NAMES.includes(d.name) ? G_LP : G_OTHER });
    S.data.receipts = (v1.receipts || []).map(r => ({ id:r.id, batch:r.date + "-v1", date:invDates.has(r.date) ? addDays(r.date, -1) : r.date,
      drinkId:r.drinkId, qty:r.qty, note:"z pôvodnej appky", by:"migrácia", at:new Date().toISOString() }));
    S.data.counts = (v1.inventories || []).map(i => ({ id:i.id, date:i.date, counts:i.counts, by:"migrácia", at:new Date().toISOString() }));
  }, "Dáta načítané");
}

  r("2026-09-11","a",1150); r("2026-09-11","b",1112); r("2026-09-23","c",600); r("2026-09-23","e",100); r("2026-10-05","a",300);
  d.outs = [{ id:"g1", type:"propagacia", date:"2026-09-14", label:"Bratislava Marathon", items:{ a:48, b:24 } },

      { d:"2026-09-30", o:"513", c:"GSO", gso:true, k:"Granat", q:686 }, { d:"2026-09-04", o:"490", c:"Firma Alfa s.r.o.", gso:false, k:"Marakuja", q:132 },

/* ---------- štart ---------- */
async function spustit(){
  $("auth-gate").style.display = "none"; $("app-loading").style.display = "flex";
  try {
    S.user = DEMO ? "demo" : (account.username || account.name || "");
    if (DEMO && !(await DemoStore.load(FILE_SALES)).data) await DemoStore.save(FILE_SALES, seedDemoSales());
    await loadAll();
    $("app-loading").style.display = "none"; $("app-root").style.display = "block";
    if (DEMO) $("demo-bar").style.display = "block";
    go("stav");
  } catch(e){
    console.error(e);
    $("loading-text").innerHTML = `Chyba pri načítaní (${APP_VERSION}): <span style="color:var(--danger)">${esc(e.message)}</span><br><br>` +
      (DEMO ? "" : `<button onclick="odhlasit()">Odhlásiť sa a skúsiť znova</button>`);
  }
}
window.addEventListener("load", async () => {
  if (DEMO) return spustit();
  await initMsal();
  if (account) spustit(); else $("auth-gate").style.display = "flex";
});
</script>
