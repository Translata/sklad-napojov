<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sklad nápojov v2</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.17.3/lib/msal-browser.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --border:#e2e4e8; --text:#1c1e21; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#e8efff; --danger:#c2362b; --danger-soft:#fdeceb;
    --ok:#15803d; --ok-soft:#e3f4e8; --warn:#9a5b00; --warn-soft:#fdf0d8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg);
    color:var(--text); padding-bottom:76px; font-size:15px;}
  header{background:var(--accent); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; gap:10px;}
  header h1{font-size:18px; margin:0; font-weight:600;}
  header .right{display:flex; align-items:center; gap:8px; font-size:12px;}
  header .right button{background:rgba(255,255,255,.2); color:#fff; padding:5px 10px; font-size:12px; font-weight:500;}
  main{padding:12px; max-width:760px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  h3{font-size:16px; margin:0;}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--border); border-radius:8px;
    background:#fff; color:var(--text); font-family:inherit;}
  input[type=date]{-webkit-appearance:none; appearance:none; text-align:left; min-height:44px; display:block;}
  input[type=date]::-webkit-date-and-time-value{text-align:left;}
  textarea{min-height:64px; resize:vertical;}
  button{font-size:15px; padding:10px 16px; border-radius:8px; border:none; cursor:pointer; background:var(--accent);
    color:#fff; font-weight:600; font-family:inherit;}
  button.secondary{background:#e5e7eb; color:var(--text);}
  button.danger{background:var(--danger);}
  button.small{padding:5px 10px; font-size:13px;}
  button:disabled{opacity:.55; cursor:default;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:0;}
  .muted{color:var(--muted); font-size:13px;}
  .num{font-variant-numeric:tabular-nums;}
  .empty{color:var(--muted); text-align:center; padding:22px 0;}
  .screen{display:none;} .screen.active{display:block;}
  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom,0px);}
  nav.tabs button{flex:1; background:none; color:var(--muted); border-radius:0; padding:9px 2px; font-size:11px;
    font-weight:500; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.tabs button.active{color:var(--accent); font-weight:700;}
  nav.tabs svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  nav.tabs .badge{position:absolute; margin-left:16px; margin-top:-3px; background:var(--danger); color:#fff;
    font-size:10px; min-width:16px; height:16px; border-radius:8px; line-height:16px; text-align:center; padding:0 4px;}
  .chip{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;}
  .chip.ok{background:var(--ok-soft); color:var(--ok);} .chip.bad{background:var(--danger-soft); color:var(--danger);}
  .chip.warn{background:var(--warn-soft); color:var(--warn);} .chip.neu{background:#eceef2; color:var(--muted);}
  .drink-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .ln{display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:14px;}
  .ln.sum{border-top:1px solid var(--border); margin-top:4px; padding-top:6px; font-weight:600;}
  .ln.bad{color:var(--danger); font-weight:700;} .ln.good{color:var(--ok); font-weight:600;}
  .ln .sub{color:var(--muted); font-size:12px;}
  .grid{display:flex; flex-direction:column;}
  .grid .it{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border);}
  .grid .it:last-child{border-bottom:none;}
  .grid .it span{flex:1; min-width:0;} .grid .it input{width:100px;}
  .grp{font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:14px 0 4px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{padding:7px 4px; text-align:right; border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  th{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .scroll{overflow-x:auto;}
  .mv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border); align-items:flex-start;}
  .mv:first-child{border-top:none;}
  .mv .l{min-width:0; overflow-wrap:anywhere;} .mv .r{text-align:right; white-space:nowrap;}
  details.new > summary{list-style:none; cursor:pointer; background:var(--accent); color:#fff; font-weight:600;
    padding:10px 16px; border-radius:8px; text-align:center;}
  details.new > summary::-webkit-details-marker{display:none;}
  details.new[open] > summary{background:#e5e7eb; color:var(--text); margin-bottom:6px;}
  .center{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:14px;}
  .center p{color:var(--muted); max-width:340px;}
  .spinner{width:36px; height:36px; border-radius:50%; border:4px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:#1c1e21; color:#fff; padding:10px 18px;
    border-radius:8px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:30; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
  .overlay .box{background:#fff; width:100%; max-width:560px; border-radius:14px 14px 0 0; padding:16px; max-height:90vh; overflow:auto;}
  @media (min-width:600px){ .overlay{align-items:center;} .overlay .box{border-radius:14px;} }
  .demo{background:var(--warn-soft); color:var(--warn); text-align:center; font-size:12px; padding:4px;}
</style>
</head>
<body>

<header>
  <h1>Sklad nápojov v2</h1>
  <div class="right" id="hdr-right" style="display:none;"></div>
</header>
<div id="demo-bar" class="demo" style="display:none;">Ukážkový režim: dáta sú len v tomto prehliadači a nie sú skutočné.</div>

<div id="auth-gate" class="center" style="display:none;">
  <p>Táto aplikácia ukladá dáta do SharePointu vo vašom M365. Prihlás sa pracovným Microsoft účtom.</p>
  <button onclick="prihlasit()">Prihlásiť sa cez Microsoft</button>
  <p id="auth-error" style="color:var(--danger);"></p>
</div>
<div id="app-loading" class="center" style="display:none;">
  <div class="spinner"></div><p id="loading-text">Načítavam dáta zo SharePointu...</p>
</div>

<div id="app-root" style="display:none;">
<main>
  <section id="screen-cesta" class="screen active"></section>
  <section id="screen-sklad" class="screen"></section>
  <section id="screen-pohyby" class="screen"></section>
  <section id="screen-inventura" class="screen"></section>
  <section id="screen-kontrola" class="screen"></section>
  <section id="screen-nastavenia" class="screen"></section>
</main>
<nav class="tabs">
  <button data-s="cesta" onclick="go('cesta')"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 17c6 0 2-10 8-10"/></svg>Cesta</button>
  <button data-s="sklad" onclick="go('sklad')"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg>Sklad</button>
  <button data-s="pohyby" onclick="go('pohyby')"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Pohyby</button>
  <button data-s="inventura" onclick="go('inventura')"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 15h4"/></svg>Inventúra</button>
  <button data-s="kontrola" onclick="go('kontrola')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16v.5"/></svg>Kontrola<span class="badge" id="badge" style="display:none;"></span></button>
</nav>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>

<script>
/* Sklad nápojov v2, fáza 1.
   Model: kniha pohybov + inventúry. Obdobie medzi inventúrami A a B = A.dátum <= pohyb < B.dátum
   (dňom inventúry sa začína nové obdobie). Očakávaný stav = stav pri A + príjmy + vrátenia - predaj - rozdané - straty.
   Rozdiel = napočítané pri B - očakávaný stav. Nezrovnalosť sa vysvetľuje v Kontrole, nič sa nemaže (soft delete).
   Dáta: Sklad-app/sklad-data-v2.json na SharePointe (alebo ?demo=1: localStorage s vymyslenými dátami). */

const APP_VERSION = "v2.2-fáza2";
const DEMO = new URLSearchParams(location.search).has("demo");
const MSAL_CONFIG = { auth:{ clientId:"22026742-db1b-4ee6-877a-5b279b1e5775",
  authority:"https://login.microsoftonline.com/35f15dc8-00c9-43d4-99e4-ab82e15ec3bb",
  redirectUri: location.origin + location.pathname }, cache:{ cacheLocation:"localStorage" } };
const GRAPH_SCOPES = ["Sites.ReadWrite.All"];
const SITE_HOST = "translata.sharepoint.com", SITE_PATH = "/sites/liquidpositive";
const FILE_V2 = "Sklad-app/sklad-data-v2.json", FILE_V1 = "Sklad-app/sklad-data.json", FILE_SHOP = "Sklad-app/shoptet-vydaj.json";
const LP_NAMES = ["Orange","Marakuja","Granat","Pure","Cannabis","Cherry","Outlast"];
const G1 = "Plechovky Liquid Positive", G2 = "Krab a pivá";
/* kódy produktov v Shoptete (PPP) podľa názvu nápoja v appke; dopĺňajú sa tlačidlom v Nastaveniach */
const KNOWN_CODES = { "Orange":["320"], "Marakuja":["319"], "Granat":["318"], "Granát":["318"], "Pure":["316"], "Cannabis":["317"],
  "Cherry":["454"], "Outlast":["459"], "Krab 0,5 plech":["362"], "Jedenastka 1L plast":["98"], "Vandal 14°1L plast":["99"],
  "Cervena veza 12°1L plast":["100"], "APAc 13°1L plast":["198"], "Jedenastka 0,75 sklo":["68"], "Vandal 14°0,75 sklo":["74"],
  "Cervena veza 12°0,75 sklo":["65"], "APAc 13°0,75 sklo":["62"] };

const TYPES = {
  prijem:  { label:"Naskladnenie", sign: 1 },
  vratenie:{ label:"Vrátenie",     sign: 1 },
  predaj:  { label:"Predaj",       sign:-1 },
  rozdane: { label:"Rozdané",      sign:-1 },
  strata:  { label:"Strata / poškodenie", sign:-1 }
};

let S = { data:null, etag:null, shop:{ lines:[], meta:null }, shopEtag:null, user:"", screen:"cesta", period:null };

/* ---------- pomocné ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("sk-SK");
const fmtN = n => nf.format(n);
const MINUS = "−";
const sgn = n => n > 0 ? "+" + fmtN(n) : n < 0 ? MINUS + fmtN(-n) : "0";
const fmtD = iso => { const [y,m,d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const isGSO = c => /^gso$|good stuff only/i.test((c || "").trim());
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2800); }
const emptyData = () => ({ version:2, drinks:[], movements:[], inventories:[], resolutions:[], settings:{ gsoIco:"" }, customers:{} });
function normalize(d){ d.settings = d.settings || { gsoIco:"" }; d.customers = d.customers || {}; d.resolutions = d.resolutions || [];
  d.drinks.forEach(x => { x.codes = x.codes || []; }); return d; }

/* ---------- výpočty (čisté funkcie nad S.data) ---------- */
const invs = () => [...S.data.inventories].sort((a,b) => a.date.localeCompare(b.date));
/* Riadky z Shoptetu (PPP) sa správajú ako pohyby typu „predaj“; kód produktu sa mapuje na nápoj podľa Nastavení. */
function shopMoves(){
  const byCode = {}; S.data.drinks.forEach(d => (d.codes || []).forEach(c => { byCode[c] = d.id; }));
  const gso = (S.data.settings.gsoIco || "").trim(), names = S.data.customers, out = [];
  for (const l of S.shop.lines){ const drinkId = byCode[l.c]; if (!drinkId) continue;
    out.push({ id:"s:" + l.o + "|" + l.c, date:l.d, drinkId, qty:l.q, type:"predaj", source:"shoptet", ref:l.o, ico:l.i,
      customer: (gso && l.i === gso) ? "GSO" : (names[l.i] || (l.i ? "IČO " + l.i : "E-shop B2C (Shoptet)")) }); }
  return out;
}
const liveMoves = () => S.data.movements.filter(m => !m.deleted).concat(shopMoves());
const visibleDrinks = () => S.data.drinks.filter(d => !d.hidden);

function periodCalc(A, B, drink){
  const ms = liveMoves().filter(m => m.drinkId === drink.id && m.date >= A.date && (!B || m.date < B.date));
  const sum = f => ms.filter(f).reduce((s,m) => s + m.qty, 0);
  const customers = {};
  ms.filter(m => m.type === "predaj" && !isGSO(m.customer)).forEach(m => {
    const k = (m.customer || "bez odberateľa").trim(); customers[k] = (customers[k] || 0) + m.qty; });
  const open = A.counts[drink.id] ?? null;
  const r = { open, prijem:sum(m => m.type==="prijem"), vratenie:sum(m => m.type==="vratenie"),
    gso:sum(m => m.type==="predaj" && isGSO(m.customer)), other:sum(m => m.type==="predaj" && !isGSO(m.customer)),
    rozdane:sum(m => m.type==="rozdane"), strata:sum(m => m.type==="strata"), customers, moves:ms.length };
  r.expected = open == null ? null : open + r.prijem + r.vratenie - r.gso - r.other - r.rozdane - r.strata;
  r.counted = B ? (B.counts[drink.id] ?? null) : null;
  r.diff = (r.expected != null && r.counted != null) ? r.counted - r.expected : null;
  return r;
}
const resFor = (invId, drinkId) => S.data.resolutions.find(r => r.invId === invId && r.drinkId === drinkId);

function openDiscrepancies(){
  const I = invs(), out = [];
  for (let i = 1; i < I.length; i++) for (const d of S.data.drinks){
    const c = periodCalc(I[i-1], I[i], d);
    if (c.diff && c.diff !== 0 && !resFor(I[i].id, d.id)) out.push({ A:I[i-1], B:I[i], drink:d, c });
  }
  return out;
}

/* ---------- úložisko ---------- */
let msalInstance = null, account = null, SITE_ID = null;
async function initMsal(){
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  const res = await msalInstance.handleRedirectPromise();
  if (res && res.account) { account = res.account; return; }
  const a = msalInstance.getAllAccounts(); if (a.length) { account = a[0]; return; }
  try { account = (await msalInstance.ssoSilent({ scopes:GRAPH_SCOPES })).account; } catch(e){}
}
function prihlasit(){ $("auth-error").textContent = ""; msalInstance.loginRedirect({ scopes:GRAPH_SCOPES }); }
function odhlasit(){ msalInstance.logoutRedirect(); }
async function token(){
  try { return (await msalInstance.acquireTokenSilent({ scopes:GRAPH_SCOPES, account })).accessToken; }
  catch(e){ await msalInstance.acquireTokenRedirect({ scopes:GRAPH_SCOPES }); return null; }
}
async function gfetch(url, opt = {}){
  const t = await token();
  return fetch(url, { ...opt, headers:{ Authorization:`Bearer ${t}`, ...(opt.headers || {}) } });
}
async function siteId(){
  if (SITE_ID) return SITE_ID;
  const r = await gfetch(`https://graph.microsoft.com/v1.0/sites/${SITE_HOST}:${SITE_PATH}`);
  if (!r.ok) throw new Error(`Site (${r.status})`);
  SITE_ID = (await r.json()).id; return SITE_ID;
}
const itemUrl = p => `https://graph.microsoft.com/v1.0/sites/${SITE_ID}/drive/root:/${p}`;

const GraphStore = {
  async load(file, etagKey){
    await siteId();
    const meta = await gfetch(itemUrl(file));
    if (meta.status === 404) { S[etagKey] = null; return null; }
    if (!meta.ok) throw new Error(`Načítanie (${meta.status})`);
    S[etagKey] = (await meta.json()).eTag;
    const c = await gfetch(itemUrl(file) + ":/content");
    if (!c.ok) throw new Error(`Obsah (${c.status})`);
    return await c.json();
  },
  async save(file, etagKey, data){
    const headers = { "Content-Type":"application/json" };
    if (S[etagKey]) headers["If-Match"] = S[etagKey];
    const r = await gfetch(itemUrl(file) + ":/content", { method:"PUT", headers, body:JSON.stringify(data) });
    if (r.status === 412) throw new Error("CONFLICT");
    if (!r.ok) throw new Error(`Zápis (${r.status})`);
    S[etagKey] = (await r.json()).eTag;
  },
  async loadV1(){
    await siteId();
    const c = await gfetch(itemUrl(FILE_V1) + ":/content");
    if (!c.ok) throw new Error(`v1 súbor (${c.status})`);
    return await c.json();
  }
};
const DemoStore = {
  async load(file){ const r = (window.__mem || {})[file] ?? localStorage.getItem("sklad_v2_demo:" + file); return r ? JSON.parse(r) : null; },
  async save(file, etagKey, data){ try { localStorage.setItem("sklad_v2_demo:" + file, JSON.stringify(data)); } catch(e){ (window.__mem = window.__mem || {})[file] = JSON.stringify(data); } },
  async loadV1(){ throw new Error("V ukážkovom režime nie je v1 súbor."); }
};
const Store = DEMO ? DemoStore : GraphStore;

async function loadAll(){
  S.data = normalize((await Store.load(FILE_V2, "etag")) || (DEMO ? seedDemo() : emptyData()));
  S.shop = (await Store.load(FILE_SHOP, "shopEtag")) || { lines:[], meta:null };
}
async function reload(){ await loadAll(); renderAll(); }
async function mutate(fn, okMsg){
  const snap = JSON.stringify(S.data);
  try { fn(); await Store.save(FILE_V2, "etag", S.data); if (okMsg) toast(okMsg); renderAll(); return true; }
  catch(e){
    S.data = JSON.parse(snap);
    if (e.message === "CONFLICT") { toast("Dáta medzitým zmenil niekto iný. Načítavam znova, zápis zopakuj."); await reload(); }
    else { toast("Chyba: " + e.message); renderAll(); }
    return false;
  }
}
async function mutateShop(fn, okMsg){
  const snap = JSON.stringify(S.shop);
  try { fn(); await Store.save(FILE_SHOP, "shopEtag", S.shop); if (okMsg) toast(okMsg); renderAll(); return true; }
  catch(e){
    S.shop = JSON.parse(snap);
    if (e.message === "CONFLICT") { toast("Dáta medzitým zmenil niekto iný. Načítavam znova, zápis zopakuj."); await reload(); }
    else { toast("Chyba: " + e.message); renderAll(); }
    return false;
  }
}

/* ---------- navigácia ---------- */
function go(s){
  S.screen = s;
  document.querySelectorAll(".screen").forEach(e => e.classList.toggle("active", e.id === "screen-" + s));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.s === s));
  window.scrollTo(0, 0); renderAll();
}
function renderAll(){
  if (!S.data) return;
  renderHeader();
  ({ cesta:renderCesta, sklad:renderSklad, pohyby:renderPohyby, inventura:renderInventura,
     kontrola:renderKontrola, nastavenia:renderNastavenia }[S.screen])();
  const n = openDiscrepancies().length, b = $("badge");
  b.style.display = n ? "inline-block" : "none"; b.textContent = n;
}
function renderHeader(){
  $("hdr-right").style.display = "flex";
  $("hdr-right").innerHTML = `<button onclick="go('nastavenia')">Nastavenia</button>` +
    (DEMO ? "" : `<button onclick="odhlasit()">Odhlásiť</button>`);
}

/* ---------- CESTA ---------- */
function periodOptions(){
  const I = invs(), o = [];
  if (I.length) o.push({ key:"open", A:I[I.length-1], B:null, label:`od ${fmtD(I[I.length-1].date)} (prebieha)` });
  for (let i = I.length - 1; i >= 1; i--) o.push({ key:"p" + i, A:I[i-1], B:I[i], label:`${fmtD(I[i-1].date)} až ${fmtD(I[i].date)}` });
  return o;
}
function renderCesta(){
  const el = $("screen-cesta"), opts = periodOptions();
  if (!opts.length){

  if (gsoTot || cl.length) html += `<div class="card"><h2>Kam plechovky odišli (predaj)</h2><table><thead><tr><th>Odberateľ</th><th>ks</th></tr></thead><tbody>
    ${gsoTot ? `<tr><td>GSO (doklad)</td><td class="num"><b>${fmtN(gsoTot)}</b></td></tr>` : ""}
    ${cl.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${fmtN(v)}</td></tr>`).join("")}</tbody></table></div>`;

function ln(label, val, cls = "", sub = ""){
  return `<div class="ln ${cls}"><span>${label}${sub ? `<div class="sub">${sub}</div>` : ""}</span><span class="num">${val}</span></div>`;
}
function drinkCard(d, c, A, B){
  const res = B ? resFor(B.id, d.id) : null;
  let chip;
  if (c.open == null) chip = `<span class="chip neu">bez otváracieho stavu</span>`;
  else if (!B) chip = `<span class="chip neu">odhad</span>`;
  else if (c.counted == null) chip = `<span class="chip neu">nenapočítané</span>`;
  else if (c.diff === 0) chip = `<span class="chip ok">OK</span>`;
  else if (res) chip = `<span class="chip warn">Vysvetlená</span>`;
  else chip = `<span class="chip bad">Nezrovnalosť ${sgn(c.diff)}</span>`;
  const cust = Object.entries(c.customers).sort((a,b) => b[1] - a[1]).map(([k,v]) => `${esc(k)} ${fmtN(v)}`).join(", ");
  let h = `<div class="card"><div class="drink-head"><h3>${esc(d.name)}</h3>${chip}</div>`;
  h += ln("Otvárací stav", c.open == null ? "–" : fmtN(c.open));
  h += ln("+ Naskladnené", fmtN(c.prijem));
  if (c.vratenie) h += ln("+ Vrátenia", fmtN(c.vratenie));
  if (c.gso) h += ln(MINUS + " Predaj GSO", fmtN(c.gso));
  if (c.other) h += ln(MINUS + " Predaj ostatným", fmtN(c.other), "", cust);
  if (c.rozdane) h += ln(MINUS + " Rozdané", fmtN(c.rozdane));
  if (c.strata) h += ln(MINUS + " Straty", fmtN(c.strata));
  h += ln(B ? "= Očakávaný stav" : "= Odhad stavu teraz", c.expected == null ? "–" : fmtN(c.expected), "sum");
  if (B){
    h += ln("Napočítané", c.counted == null ? "–" : fmtN(c.counted));
    if (c.diff != null) h += ln("Rozdiel", sgn(c.diff), c.diff === 0 ? "good" : (res ? "" : "bad"));
    if (c.diff && !res) h += `<div style="margin-top:8px;"><button class="small" onclick="openExplain('${B.id}','${d.id}')">Vysvetliť</button></div>`;
    if (res) h += `<p class="muted" style="margin:8px 0 0;">${esc(resLabel(res))}${res.note ? ": " + esc(res.note) : ""}</p>`;
  }
  return h + `</div>`;
}

      S.data.movements.push({ id:movementId, date, drinkId, qty:Math.abs(c.diff), type:reason === "chyba_prijem" ? "prijem" : reason,
        note:"Doplnené pri vysvetlení nezrovnalosti: " + note, source:"vysvetlenie", by:S.user, at:now }); }
    S.data.resolutions.push({ id:uid(), invId, drinkId, reason, note, diff:c.diff, expected:c.expected, counted:c.counted, movementId, by:S.user, at:now });
  }, "Vysvetlenie uložené");
  if (ok) closeModal();
}

/* ---------- import zo Shoptetu (PPP) ---------- */
function parseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ";"){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c; }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function decodeBytes(buf){
  try { return new TextDecoder("utf-8", { fatal:true }).decode(buf); }
  catch(e){ return new TextDecoder("windows-1250").decode(buf); }
}
/* z CSV vyberie len odoslané produktové riadky; riadky s rovnakým kódom v jednej objednávke sa sčítajú */
function buildShopLines(text){
  const rows = parseCsv(text.replace(/^\uFEFF/, ""));
  if (rows.length < 2) throw new Error("Súbor je prázdny");
  const h = {}; rows[0].forEach((n, i) => { h[n.trim()] = i; });
  const miss = ["code","date","statusName","orderItemType","orderItemCode","orderItemName","orderItemAmount","customerIdentificationNumber"].filter(n => !(n in h));
  if (miss.length) throw new Error("V súbore chýbajú stĺpce: " + miss.join(", "));
  const compCol = ["billCompany","billingCompany","company","billCompanyName"].find(n => n in h)
    ?? Object.keys(h).find(n => /company/i.test(n) && !/item/i.test(n));
  const names = {};
  const map = new Map(), orders = new Set(); let min = "9999-99-99", max = "0000-00-00";
  for (let r = 1; r < rows.length; r++){ const x = rows[r];
    if (x.length < 8 || x[h.statusName] !== "Odoslaná" || x[h.orderItemType] !== "product") continue;
    const c = (x[h.orderItemCode] || "").trim(), q = parseFloat((x[h.orderItemAmount] || "0").replace(",", ".")) || 0;
    if (!c || !q) continue;
    const o = x[h.code].trim(), d = x[h.date].slice(0, 10), i = (x[h.customerIdentificationNumber] || "").trim();
    if (compCol && i){ const nm = (x[h[compCol]] || "").trim(); if (nm) names[i] = nm; }
    orders.add(o); if (d < min) min = d; if (d > max) max = d;
    const k = o + "|" + c, cur = map.get(k);
    if (cur) cur.q += q; else map.set(k, { o, d, i, c, n:(x[h.orderItemName] || "").slice(0, 60), q });
  }
  return { lines:[...map.values()], orders:orders.size, min, max, names, hasNames:!!compCol };
}
async function importShoptetText(text, fileName){
  const b = buildShopLines(text);
  if (!b.lines.length) throw new Error("Nenašli sa žiadne odoslané produktové riadky");
  const old = S.shop.lines, keyOf = l => l.o + "|" + l.c;
  const oldKeys = new Set(old.filter(l => l.d >= b.min && l.d <= b.max).map(keyOf)), newKeys = new Set(b.lines.map(keyOf));
  const added = [...newKeys].filter(k => !oldKeys.has(k)).length, removed = [...oldKeys].filter(k => !newKeys.has(k)).length;
  const known = new Set(S.data.drinks.flatMap(d => d.codes || [])), un = {};
  b.lines.forEach(l => { if (!known.has(l.c)){ const u = un[l.c] || (un[l.c] = { code:l.c, name:l.n, qty:0 }); u.qty += l.q; } });
  const unmapped = Object.values(un).sort((a, c) => c.qty - a.qty).slice(0, 12);
  const ok = await mutateShop(() => {
    S.shop.lines = old.filter(l => l.d < b.min || l.d > b.max).concat(b.lines).sort((a, c) => a.d.localeCompare(c.d));
    S.shop.meta = { at:new Date().toISOString(), by:S.user, file:fileName, from:b.min, to:b.max, orders:b.orders, lines:b.lines.length, added, removed, unmapped, hasNames:b.hasNames };
  }, `Import hotový: ${b.orders} objednávok, nových riadkov ${added}, odstránených ${removed}`);
  if (ok) await applyNames(b.names);
  return ok;
}
/* Názvy firiem z exportu doplnia len chýbajúce (ručne zadaný názov má prednosť); firma „Good Stuff Only“ nastaví IČO GSO, ak ešte nie je. */
async function applyNames(names){
  const miss = Object.entries(names).filter(([i]) => !S.data.customers[i]);
  const gso = !S.data.settings.gsoIco && Object.entries(names).find(([, n]) => /good\s*stuff\s*only/i.test(n));
  if (!miss.length && !gso) return;
  await mutate(() => { miss.forEach(([i, n]) => { S.data.customers[i] = n; }); if (gso) S.data.settings.gsoIco = gso[0]; },
    `Z exportu doplnené názvy firiem: ${miss.length}${gso ? ", IČO GSO nastavené" : ""}`);
}
async function onShopFile(inp){
  const f = inp.files[0]; if (!f) return;
  try { await importShoptetText(decodeBytes(await f.arrayBuffer()), f.name); }
  catch(e){ toast("Import zlyhal: " + e.message); }
  inp.value = "";
}
async function setGso(v){ await mutate(() => { S.data.settings.gsoIco = v.trim(); }, "IČO GSO uložené"); }
async function setCustomer(ico, v){ await mutate(() => { v = v.trim(); if (v) S.data.customers[ico] = v; else delete S.data.customers[ico]; }); }
async function setCodes(id, v){ await mutate(() => { drinkById(id).codes = v.split(/[,\s]+/).map(s => s.trim()).filter(Boolean); }); }
async function fillKnownCodes(){
  let n = 0;
  await mutate(() => S.data.drinks.forEach(d => { const k = KNOWN_CODES[d.name]; if (k && !(d.codes || []).length){ d.codes = [...k]; n++; } }),
    "Kódy doplnené pri nápojoch: " + n);
}

/* ---------- hromadné vysvetlenie kladných rozdielov ---------- */
function openBulk(invId){
  const items = openDiscrepancies().filter(x => x.B.id === invId && x.c.diff > 0);
  if (!items.length) return;
  const B = items[0].B, A = items[0].A, tot = items.reduce((s, x) => s + x.c.diff, 0);
  $("modal").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="box">
    <h3>Vysvetliť ${items.length} kladných rozdielov naraz</h3>
    <p class="muted">Obdobie ${fmtD(A.date)} až ${fmtD(B.date)}. Spolu ${fmtN(tot)} ks napočítaných navyše: ${items.map(x => esc(x.drink.name) + " " + sgn(x.c.diff)).join(", ")}.
    Každý rozdiel sa vysvetlí ako chýbajúce naskladnenie: doplní sa príjem v daný deň pred inventúrou (${fmtD(addDays(B.date, -1))}).</p>
    <label for="bk-note">Poznámka (povinná)</label>
    <textarea id="bk-note">Priamo z výroby ku klientovi, nezapísané ako naskladnenie</textarea>
    <div class="row" style="margin-top:12px;"><button class="secondary" onclick="closeModal()">Zrušiť</button>
    <button onclick="doBulk('${invId}')">Doplniť príjmy</button></div></div></div>`;
}
async function doBulk(invId){
  const note = $("bk-note").value.trim(); if (!note) return toast("Doplň poznámku");
  const items = openDiscrepancies().filter(x => x.B.id === invId && x.c.diff > 0), now = new Date().toISOString();
  const ok = await mutate(() => items.forEach(x => { const mid = uid();
    S.data.movements.push({ id:mid, date:addDays(x.B.date, -1), drinkId:x.drink.id, qty:x.c.diff, type:"prijem",
      note:"Doplnené pri vysvetlení nezrovnalosti: " + note, source:"vysvetlenie", by:S.user, at:now });
    S.data.resolutions.push({ id:uid(), invId, drinkId:x.drink.id, reason:"chyba_prijem", note, diff:x.c.diff,
      expected:x.c.expected, counted:x.c.counted, movementId:mid, by:S.user, at:now }); }), `Vysvetlené: ${items.length}`);
  if (ok) closeModal();
}
